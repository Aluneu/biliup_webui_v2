name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 官方 Pages 部署需要这两个权限（用 OIDC，不需要写仓库分支）
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build（推导 BASE_PATH）
        # 项目站点部署在 user.github.io/<repo>/ 子路径，需要 basePath=/<repo>。
        # 若仓库本身就是 <user>.github.io（user 主页，根域名），basePath 留空。
        # 在 shell 里用 github.repository 解析，对 push 和手动 workflow_dispatch 都稳。
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/$NAME"
          fi
          echo "BASE_PATH=${BASE_PATH}"
          BASE_PATH="$BASE_PATH" npm run build
          # 禁用 Jekyll：以防万一（官方 artifact 通常不走 Jekyll，但无妨）
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
